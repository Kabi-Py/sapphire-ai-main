<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="privacy.html">Privacy</a>
            <a href="contact.html">Contact</a>
        </div>

        <h1>Contact</h1>
        <p>Have a question or need support? Reach out using the form below.</p>
        
        <!-- The form action points to FormSubmit with your email -->
        <form class="contact-form" action="https://formsubmit.co/scytherkalhoro@gmail.com" method="POST">
            
            <!-- Optional: Disable the captcha for a smoother user experience -->
            <input type="hidden" name="_captcha" value="false">
            
            <!-- Optional: Set a custom email subject -->
            <input type="hidden" name="_subject" value="New Contact Form Submission!">

            <input type="text" name="name" placeholder="Your Name" required>
            <input type="email" name="email" placeholder="Your Email" required>
            <textarea name="message" rows="5" placeholder="How can we help?" required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </div>
</body>
</html>
