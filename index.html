<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Sapphire AI</title>
    <!-- Tailwind CSS & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Inter"', "sans-serif"],
              display: ['"Outfit"', "sans-serif"],
            },
            colors: {
              surface: {
                800: "#2b1433",
                900: "#1a0b22",
                950: "#120618",
              },
            },
            animation: {
              "float": "floatAnim 5s ease-in-out infinite",
              "bounce-slow": "bounce 2.5s infinite",
              "pulse-slow": "pulseGlow 6s ease-in-out infinite",
              "ambient-red": "redDrift 14s ease-in-out infinite alternate",
              "ambient-purple": "purpleDrift 16s ease-in-out infinite alternate",
              "ambient-center": "centerPulse 10s ease-in-out infinite alternate",
            },
            keyframes: {
              floatAnim: {
                "0%, 100%": { transform: "translate3d(0, 0, 0)" },
                "50%": { transform: "translate3d(0, -8px, 0)" },
              },
              pulseGlow: {
                "0%, 100%": { opacity: 0.75, transform: "scale(1)" },
                "50%": { opacity: 1, transform: "scale(1.05)" },
              },
              redDrift: {
                "0%": { transform: "translate3d(0, 0, 0) scale(1) rotate(0deg)" },
                "50%": { transform: "translate3d(80px, 60px, 0) scale(1.25) rotate(10deg)" },
                "100%": { transform: "translate3d(-40px, 80px, 0) scale(1.1) rotate(-10deg)" },
              },
              purpleDrift: {
                "0%": { transform: "translate3d(0, 0, 0) scale(1) rotate(0deg)" },
                "50%": { transform: "translate3d(-90px, -70px, 0) scale(1.3) rotate(-15deg)" },
                "100%": { transform: "translate3d(50px, -50px, 0) scale(1.15) rotate(10deg)" },
              },
              centerPulse: {
                "0%": { transform: "translate3d(0, 0, 0) scale(1)", opacity: 0.2 },
                "50%": { transform: "translate3d(40px, -30px, 0) scale(1.25)", opacity: 0.35 },
                "100%": { transform: "translate3d(-30px, 40px, 0) scale(0.95)", opacity: 0.2 },
              },
            },
          },
        },
      };
    </script>
    <style>
      /* Global resets & text selection prevention */
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #120618;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }

      /* Completely hide native scrollbars across all browsers */
      html, body {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      ::-webkit-scrollbar {
        display: none;
        width: 0px;
        background: transparent;
      }

      /* Logo & Text Gradient: Perfectly matched to the logo icon (Vibrant Red -> Rich Magenta -> Deep Purple) */
      .logo-gradient {
        background: linear-gradient(135deg, #ff1744 0%, #e91e63 45%, #8e24aa 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-wrap: balance;
      }

      .badge-box {
        background: linear-gradient(135deg, rgba(255, 23, 68, 0.2) 0%, rgba(142, 36, 170, 0.2) 100%);
        border: 1px solid rgba(142, 36, 170, 0.35);
      }

      /* Parallax scene perspective */
      .parallax-scene {
        perspective: 1400px;
      }
      .parallax-card {
        transform-style: preserve-3d;
        transition: transform 0.25s cubic-bezier(0.03, 0.98, 0.52, 0.99);
        will-change: transform;
      }
    </style>
  </head>
  <body class="text-gray-100 font-sans min-h-screen overflow-x-hidden relative">
    <!-- Volumetric Live Background Lighting: Actively Animated Flowing Blobs -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none -z-50">
      <!-- Top-Left Bright Red-Orange / Coral Pink Glow -->
      <div class="absolute -top-[5%] -left-[10%] w-[55vw] h-[55vw] rounded-full bg-[#ff1744]/35 blur-[130px] animate-ambient-red"></div>
      <!-- Center Hot Pink Transition Glow -->
      <div class="absolute top-[25%] left-[20%] w-[50vw] h-[50vw] rounded-full bg-[#e91e63]/25 blur-[150px] animate-ambient-center"></div>
      <!-- Bottom-Right Deep Purple Glow -->
      <div class="absolute -bottom-[5%] -right-[10%] w-[55vw] h-[55vw] rounded-full bg-[#8e24aa]/40 blur-[140px] animate-ambient-purple"></div>
      <!-- Enhanced Center Vignette Overlay to guarantee perfect text contrast -->
      <div class="absolute inset-0 bg-radial from-[#120618]/20 via-[#120618]/60 to-[#120618]/90"></div>
    </div>

    <!-- Custom Fading Overlay Scrollbar -->
    <div id="custom-scrollbar" class="fixed right-0 top-0 bottom-0 w-2 z-50 pointer-events-none opacity-0 transition-opacity duration-300">
      <div id="custom-thumb" class="w-1.5 absolute right-0 rounded-full" style="background: linear-gradient(180deg, rgba(255, 23, 68, 0) 0%, rgba(255, 23, 68, 0.9) 25%, rgba(233, 30, 99, 0.9) 50%, rgba(142, 36, 170, 0.9) 75%, rgba(142, 36, 170, 0) 100%);"></div>
    </div>

    <!-- Section 1: Hero Section -->
    <section id="hero-section" class="relative h-screen w-full flex flex-col items-center justify-between py-10 px-4 z-10 overflow-hidden">
      <!-- Top Balance Spacer -->
      <div class="w-full h-10 pointer-events-none opacity-0"></div>

      <!-- Hero Content -->
      <div id="hero-content" class="w-full max-w-4xl mx-auto space-y-5 text-center will-change-transform transition-transform duration-75 my-auto">
        <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full badge-box text-xs sm:text-sm font-semibold tracking-wider uppercase text-white shadow-xl mx-auto">
          <i class="fa-solid fa-sparkles text-rose-400"></i> Intelligence Unleashed
        </div>
        <h1 class="text-4xl sm:text-6xl md:text-7xl font-display font-extrabold logo-gradient tracking-tight leading-[1.1] py-2" style="filter: drop-shadow(0 4px 24px rgba(0, 0, 0, 0.85));">
          Experience Sapphire AI
        </h1>
      </div>

      <!-- Scroll Down Indicator -->
      <div id="scroll-indicator" class="flex flex-col items-center text-center gap-2 text-gray-300 animate-bounce-slow pointer-events-none transition-opacity duration-150 h-10 pb-2">
        <span class="text-xs uppercase tracking-widest font-semibold">Scroll Down</span>
        <i class="fa-solid fa-chevron-down text-sm"></i>
      </div>
    </section>

    <!-- Section 2: Download & Web App Card Section -->
    <section class="relative min-h-screen flex items-center justify-center p-4 z-10 pb-20">
      <div id="card-entrance-wrapper" class="w-full max-w-md will-change-transform transition-transform duration-75 opacity-0 relative">
        <!-- Living Ambient Energy Aura Behind the Card -->
        <div class="absolute -inset-3 bg-gradient-to-r from-rose-500/35 via-purple-600/35 to-purple-800/35 rounded-[48px] blur-3xl animate-pulse-slow pointer-events-none -z-10"></div>

        <div class="parallax-scene w-full">
          <div
            id="parallax-card"
            class="parallax-card text-center space-y-6 p-8 sm:p-10 rounded-[36px] bg-surface-900/80 backdrop-blur-3xl border border-white/15 shadow-2xl shadow-purple-950/60 text-white"
          >
            <div style="transform: translateZ(25px);">
              <img
                src="https://avatars.githubusercontent.com/u/246972150?v=4&size=460"
                alt="Sapphire Logo"
                class="w-24 h-24 mx-auto mb-4 rounded-full shadow-2xl animate-float pointer-events-none"
                draggable="false"
              />
              <h2 class="text-3xl sm:text-4xl font-display font-extrabold logo-gradient pb-1" style="filter: drop-shadow(0 3px 12px rgba(0, 0, 0, 0.7));">
                Sapphire AI
              </h2>
            </div>

            <div style="transform: translateZ(35px);" class="space-y-4">
              <!-- Web App Button -->
              <button
                type="button"
                onclick="window.open('https://sapphire-ai-web.netlify.app/', '_blank');"
                class="w-full py-4 px-6 bg-surface-800/90 hover:bg-surface-700 text-white font-bold rounded-2xl shadow-lg transition-all duration-200 text-center flex items-center justify-center gap-2.5 border border-white/15 group active:scale-95 cursor-pointer"
              >
                <i class="fa-solid fa-globe text-xl group-hover:scale-110 transition-transform duration-300 text-rose-500" style="filter: drop-shadow(0 2px 8px rgba(255, 23, 68, 0.4));"></i>
                <span>Open Web App</span>
              </button>

              <!-- Pure White "or" text -->
              <div class="text-gray-200 text-sm font-medium tracking-wide">or</div>

              <!-- Download Heading -->
              <p class="text-gray-100 text-sm sm:text-base font-medium">
                Download the app for your platform
              </p>
            </div>

            <div
              class="flex flex-col sm:flex-row items-center justify-center gap-4 pt-2"
              style="transform: translateZ(40px);"
            >
              <!-- Windows Download Button -->
              <button
                type="button"
                onclick="/* Add Windows download action here */"
                class="w-full sm:w-48 py-4 px-6 bg-surface-800/90 hover:bg-surface-700 text-white font-bold rounded-2xl shadow-lg transition-all duration-200 text-center flex items-center justify-center gap-2.5 border border-white/15 group active:scale-95 cursor-pointer"
              >
                <i class="fa-brands fa-windows text-xl group-hover:scale-110 transition-transform duration-300 text-sky-400" style="filter: drop-shadow(0 2px 8px rgba(56, 189, 248, 0.4));"></i>
                <span>Windows</span>
              </button>

              <!-- Android Download Button -->
              <button
                type="button"
                onclick="/* Add Android download action here */"
                class="w-full sm:w-48 py-4 px-6 bg-surface-800/90 hover:bg-surface-700 text-white font-bold rounded-2xl shadow-lg transition-all duration-200 text-center flex items-center justify-center gap-2.5 border border-white/15 group active:scale-95 cursor-pointer"
              >
                <i class="fa-brands fa-android text-xl group-hover:scale-110 transition-transform duration-300 text-emerald-400" style="filter: drop-shadow(0 2px 8px rgba(52, 211, 153, 0.4));"></i>
                <span>Android</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script>
      // Custom Fading Scrollbar & Alive Continuous Parallax Physics
      const customScrollbar = document.getElementById('custom-scrollbar');
      const customThumb = document.getElementById('custom-thumb');
      const heroContent = document.getElementById('hero-content');
      const scrollIndicator = document.getElementById('scroll-indicator');
      const heroSection = document.getElementById('hero-section');
      const cardEntranceWrapper = document.getElementById('card-entrance-wrapper');
      let scrollHideTimeout;

      function updateScrollEffects() {
        const scrollTop = window.scrollY;
        const windowHeight = window.innerHeight;
        const docHeight = document.documentElement.scrollHeight - windowHeight;
        if (docHeight <= 0) return;

        // 1. Custom Scrollbar Calculation
        const scrollFraction = scrollTop / docHeight;
        const trackHeight = windowHeight;
        const thumbHeight = Math.max(60, trackHeight * (windowHeight / document.documentElement.scrollHeight));
        const thumbTravel = trackHeight - thumbHeight;
        const thumbTop = scrollFraction * thumbTravel;

        customThumb.style.height = `${thumbHeight}px`;
        customThumb.style.transform = `translate3d(0, ${thumbTop}px, 0)`;

        // Fade in custom scrollbar on scroll
        customScrollbar.style.opacity = '1';
        clearTimeout(scrollHideTimeout);
        scrollHideTimeout = setTimeout(() => {
          customScrollbar.style.opacity = '0';
        }, 700);

        // 2. Cinematic Hero Parallax Transition
        const heroHeight = heroSection.offsetHeight;
        const progress = Math.min(1, Math.max(0, scrollTop / (heroHeight * 1.3)));

        if (heroContent) {
          heroContent.style.opacity = 1 - progress * 1.3;
          heroContent.style.transform = `translate3d(0, ${-progress * 45}px, 0) scale(${1 - progress * 0.08})`;
          heroContent.style.filter = `blur(${progress * 6}px)`;
        }
        if (scrollIndicator) {
          scrollIndicator.style.opacity = 1 - progress * 3;
        }

        // 3. Continuous Alive Card Entrance & Momentum Parallax
        if (cardEntranceWrapper) {
          const cardStart = windowHeight * 0.05;
          const cardTransitionLength = windowHeight * 0.9;
          
          const rawProgress = (scrollTop - cardStart) / cardTransitionLength;
          const cardProgress = Math.min(1, Math.max(0, rawProgress));
          
          const baseScale = 0.82 + (cardProgress * 0.18);
          const continuousDrift = Math.max(0, (scrollTop - (cardStart + cardTransitionLength)) * 0.00008);
          const finalScale = baseScale + continuousDrift;
          
          const cardTranslateY = 50 * (1 - cardProgress) - (Math.max(0, scrollTop - (cardStart + cardTransitionLength)) * 0.04);
          const cardOpacity = Math.min(1, cardProgress * 1.2);
          
          cardEntranceWrapper.style.opacity = cardOpacity;
          cardEntranceWrapper.style.transform = `translate3d(0, ${cardTranslateY}px, 0) scale(${finalScale})`;
        }
      }

      // Optimized 60fps RequestAnimationFrame Handler
      let ticking = false;
      window.addEventListener("scroll", () => {
        if (!ticking) {
          window.requestAnimationFrame(() => {
            updateScrollEffects();
            ticking = false;
          });
          ticking = true;
        }
      });

      // Mouse Parallax Effect for the Card
      const card = document.getElementById("parallax-card");

      document.addEventListener("mousemove", (e) => {
        const xAxis = (window.innerWidth / 2 - e.clientX) / 90;
        const yAxis = (window.innerHeight / 2 - e.clientY) / 90;
        card.style.transform = `rotateY(${xAxis}deg) rotateX(${-yAxis}deg)`;
      });

      // Smooth reset when mouse leaves window
      document.addEventListener("mouseleave", () => {
        card.style.transform = `rotateY(0deg) rotateX(0deg)`;
      });

      // Prevent right-click context menu
      document.addEventListener("contextmenu", (e) => e.preventDefault());
    </script>
  </body>
</html>
